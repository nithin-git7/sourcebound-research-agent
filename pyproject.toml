[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcebound-research-agent"
version = "0.1.0"
description = "A citation-grounded multi-source research agent with tool calling, structured outputs, retries, and evaluations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
live = [
    "openai>=1.68.0",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[project.scripts]
research-agent = "research_agent.cli:main"

[tool.setuptools.packages.find]
include = ["research_agent*"]

[tool.setuptools.package-data]
research_agent = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

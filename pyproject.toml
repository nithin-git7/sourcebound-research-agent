[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcebound-research-agent"
version = "0.2.0"
description = "A citation-grounded multi-source research agent with tool calling, structured outputs, retries, and evaluations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Nithin" }]
keywords = ["ai-agents", "research", "citations", "openai", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
live = [
    "openai>=1.68.0",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.12.0",
]

[project.urls]
Homepage = "https://nithin-git7.github.io/Portfolio/sourcebound/"
Repository = "https://github.com/nithin-git7/sourcebound-research-agent"
Issues = "https://github.com/nithin-git7/sourcebound-research-agent/issues"

[project.scripts]
research-agent = "research_agent.cli:main"

[tool.setuptools.packages.find]
include = ["research_agent*"]

[tool.setuptools.package-data]
research_agent = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Keep the release gate focused on correctness while the pre-existing style
# debt is migrated separately.
select = ["E9", "F63", "F7", "F82", "B"]

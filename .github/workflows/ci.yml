name: Sourcebound CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package, development, and optional web adapter
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,web]"

      - name: Run tests
        run: python -m unittest discover -v

      - name: Compile Python sources
        run: python -m compileall -q research_agent tests

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
